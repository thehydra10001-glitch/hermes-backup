        # Subdomain enumeration

        subfinder -d <domain> -silent

        amass enum -d <domain> -passive

        katana -u <url> -jc  # JS-aware crawling


        # Endpoint discovery

        waybackurls <domain> | sort -u

        gau <domain>  # All known URLs

        ffuf -u <url>/FUZZ -w /usr/share/wordlists/dirb/common.txt

        ```


