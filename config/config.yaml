        ```bash

        # Nuclei — template-based scanning

        nuclei -u <url> -severity critical,high,medium

        nuclei -u <url> -tags sqli,xss,ssrf

        nuclei -l urls.txt -severity high,critical


        # Nikto

        nikto -h <url>


        # WPScan

        wpscan --url <url> --enumerate vp,vt,u


        # SQLMap

        sqlmap -u "<url>?id=1" --batch --level 3 --risk 2

        sqlmap -r request.txt --batch  # From Burp export

        ```


        ## Exploitation

        ```bash

        # FFUF fuzzing

