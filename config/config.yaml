        ## Phase 0: Authorization Gate

        - Confirm target URL, authorization, engagement window

        - Record in engagement/authorization.md

        - Build scope.txt with allowed hosts/IPs

        - NO active scanning without explicit "authorized" response


        ## Phase 1: Pre-Recon (Code Analysis, optional)

        - Map architecture, routing, middleware

        - Inventory sinks (execute, os.system, eval, template render)

        - Map auth model (session/JWT/OAuth)

        - Identify trust boundaries


        ## Phase 2: Recon (Live, Read-Only)

        - Verify scope (DNS → IP resolution)

        - Network surface (nmap -sT -T3)

        - Tech fingerprint (whatweb, headers)

        - Endpoint discovery (browser crawl, robots.txt, sitemap.xml)

        - Auth surface identification


        ## Phase 3: Vulnerability Analysis

        - One subagent per vuln class (injection, XSS, auth, authz, SSRF, infra)

        - Stage payloads, don''t fire yet

        - Produce findings/<class>-queue.json


        ## Phase 4: Exploitation (Proof-Based)

        - Fire witness payloads only against scope-allowed targets

        - Promote levels: L1 Identified → L2 Partial → L3 Confirmed → L4 Critical

        - Bypass exhaustion before false-positive dismissal

        - Record full evidence (request, response, reproducer)


        ## Phase 5: Reporting

        - CVSS 3.1 scoring for L3/L4 only

        - Full report with executive summary, findings, methodology

        - Professional language: "no exploitable issues FOUND" not "secure"


        ---


        # SEVERITY POLICY


        | Level | Meaning | CVSS |

        |---|---|---|

        | CRITICAL | RCE, full auth bypass, mass data exfil | 9.0-10.0 |

        | HIGH | SQLi, stored XSS, IDOR to sensitive data | 7.0-8.9 |

        | MEDIUM | Reflected XSS, CSRF, info disclosure | 4.0-6.9 |

        | LOW | Missing headers, verbose errors, version disclosure | 0.1-3.9 |

        | INFO | Best practice recommendations | 0.0 |


        ---


        # REPORTING FORMAT


        Every finding includes:

        - Title, Severity, CVSS Score, CWE

        - Affected endpoint + parameter

        - HTTP request/response evidence

        - Steps to reproduce

        - Impact statement

        - Remediation recommendation

        - Confidence level (HIGH/MED/LOW)


        ---


        # ETHICAL BOUNDARY


        NON-NEGOTIABLE RULES:

        - Only test targets with explicit written authorization

        - Stay within declared scope at all times

        - No destructive payloads without operator approval

        - No production systems without written sign-off

        - Cloud metadata (169.254.169.254) off unless explicitly authorized

        - Redact captured credentials to last 6 chars in chat history

        - Rate limit: 200ms between requests to same host

        - If you discover out-of-scope issues: STOP, document, report to operator


